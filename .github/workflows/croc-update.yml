name: Check for croc updates

on:
  schedule:
    - cron: '0 5 * * 0'   # Sunday 5am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout croc-app
        uses: actions/checkout@v7

      - name: Read current tracked version
        id: current
        run: |
          if [ -f third_party/CROC_VERSION ]; then
            echo "version=$(tr -d '[:space:]' < third_party/CROC_VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest croc release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/schollz/croc/releases/latest --jq .tag_name | tr -d '[:space:]')
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Replace vendored croc source
        id: replace
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          rm -rf /tmp/croc-src
          git clone --depth 1 --branch "${{ steps.latest.outputs.version }}" \
            https://github.com/schollz/croc.git /tmp/croc-src
          rm -rf third_party/croc-src
          mkdir -p third_party/croc-src
          rsync -a --exclude='.git' /tmp/croc-src/ third_party/croc-src/

      - name: Setup Go (from new go.mod)
        if: steps.current.outputs.version != steps.latest.outputs.version
        uses: actions/setup-go@v7
        with:
          go-version-file: third_party/croc-src/go.mod

      - name: Tidy, vendor, and sanity-build
        id: vendor
        if: steps.current.outputs.version != steps.latest.outputs.version
        working-directory: third_party/croc-src
        run: |
          go mod tidy
          go mod vendor
          go build ./...   # fail fast if upstream broke the build

      - name: Scan for F-Droid disallowed file types
        id: fdroid_scan
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          FLAGGED=""

          # Extensions F-Droid's scanner.py unconditionally rejects
          while IFS= read -r -d '' f; do
            FLAGGED="${FLAGGED}${f}\n"
          done < <(find third_party/croc-src \
            \( -name '*.a' -o -name '*.aar' -o -name '*.class' -o -name '*.dex' \
               -o -name '*.gz' -o -name '*.tgz' -o -name '*.so' -o -name '*.so.*' \
               -o -name '*.zip' -o -name '*.jar' -o -name '*.wasm' \) \
            ! -name 'gradle-wrapper.jar' ! -name 'gradlew.bat' \
            -print0)

          # Extensionless / .bin / .out / .exe files that are actually binary content
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            ext="${base##*.}"
            if { [ "$base" = "$ext" ] || [ "$ext" = "bin" ] || [ "$ext" = "out" ] || [ "$ext" = "exe" ]; } \
               && ! grep -Iq . "$f" 2>/dev/null; then
              FLAGGED="${FLAGGED}${f}\n"
            fi
          done < <(find third_party/croc-src -type f -print0)

          if [ -n "$FLAGGED" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "flagged<<EOF"
              echo -e "$FLAGGED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version marker and source code references
        id: bump_version
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          NEW_TAG="${{ steps.latest.outputs.version }}"
          NEW_VER="${NEW_TAG#v}"
          OLD_TAG="${{ steps.current.outputs.version }}"
          OLD_VER="${OLD_TAG#v}"

          echo "Bumping croc version: $OLD_TAG ($OLD_VER) -> $NEW_TAG ($NEW_VER)"

          # 1. Update version marker
          echo "$NEW_TAG" > third_party/CROC_VERSION

          # 2. Update app/build.gradle.kts description (current engine only)
          sed -i -E '/buildCrocAndroidArm64/,/outputs.file/ s/Build croc v[0-9.]+ for Android arm64/Build croc v'"${NEW_VER}"' for Android arm64/' app/build.gradle.kts

          # 3. Update CrocBinaryManager.kt (BINARY_VERSION, DOWNLOAD_URL, and CURRENT_SHA256)
          # Only bump current DOWNLOAD_URL, keep LEGACY_DOWNLOAD_URL intact
          sed -i -E "s/private const val BINARY_VERSION = \"[^\"]+\"/private const val BINARY_VERSION = \"${NEW_VER}\"/g" app/src/main/java/com/dking/crocapp/croc/CrocBinaryManager.kt
          sed -i -E '/^[[:space:]]*private const val DOWNLOAD_URL =/,/Linux-ARM64\.tar\.gz/ s|https://github\.com/schollz/croc/releases/download/v[^/]+/croc_v[^_]+_Linux-ARM64\.tar\.gz|https://github.com/schollz/croc/releases/download/v'"${NEW_VER}"'/croc_v'"${NEW_VER}"'_Linux-ARM64.tar.gz|' app/src/main/java/com/dking/crocapp/croc/CrocBinaryManager.kt

          TMP_TAR=$(mktemp)
          if curl -f -sL "https://github.com/schollz/croc/releases/download/v${NEW_VER}/croc_v${NEW_VER}_Linux-ARM64.tar.gz" -o "$TMP_TAR" && [ -s "$TMP_TAR" ]; then
            NEW_SHA=$(sha256sum "$TMP_TAR" | awk '{print $1}')
            if [ -n "$NEW_SHA" ] && [ "${#NEW_SHA}" -eq 64 ]; then
              sed -i -E "/^[[:space:]]*private const val CURRENT_SHA256 =/,/\"[a-f0-9]{64}\"/ s/\"[a-f0-9]{64}\"/\"${NEW_SHA}\"/" app/src/main/java/com/dking/crocapp/croc/CrocBinaryManager.kt
            fi
          fi
          rm -f "$TMP_TAR"

          # 4. Update CrocProcess.kt comments / docstrings
          sed -i -E "s/\* croc v?[0-9.]+ global flags:/\* croc v${NEW_VER} global flags:/g" app/src/main/java/com/dking/crocapp/croc/CrocProcess.kt
          sed -i -E "s/\* Only includes flags that actually exist in croc v?[0-9.]+\./\* Only includes flags that actually exist in croc v${NEW_VER}./g" app/src/main/java/com/dking/crocapp/croc/CrocProcess.kt
          sed -i -E "s|// Regex patterns for the v?[0-9.]+ output format|// Regex patterns for the v${NEW_VER} output format|g" app/src/main/java/com/dking/crocapp/croc/CrocProcess.kt

          # 5. Update strings.xml in all locales
          find app/src/main/res -name "strings.xml" -exec sed -i -E \
            -e "s|<string name=\"settings_croc_version_value\">[^<]*</string>|<string name=\"settings_croc_version_value\">v${NEW_VER}</string>|g" \
            -e "s|<string name=\"settings_croc_version_val\">[^<]*</string>|<string name=\"settings_croc_version_val\">v${NEW_VER}</string>|g" \
            {} +

          echo "Source code version bump complete. Changed files:"
          git status --short

          # Record which tracked files were actually touched, for the PR body
          # (excludes third_party/ - that's the vendored source dump, not a version-string edit)
          {
            echo "changed_files<<EOF"
            git status --porcelain --untracked-files=all | awk '{print $2}' | grep -v '^third_party/' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for stale version strings
        id: stale_check
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          OLD_VER="${{ steps.current.outputs.version }}"
          OLD_VER="${OLD_VER#v}"

          STALE=""
          if [ -n "$OLD_VER" ]; then
            STALE=$(grep -rl "$OLD_VER" \
              --exclude-dir=third_party \
              --exclude-dir=.git \
              --exclude-dir=fastlane \
              --exclude-dir=changelogs \
              --exclude-dir=build \
              --exclude-dir=.gradle \
              . || true)
          fi

          if [ -n "$STALE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$STALE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Stale version references to $OLD_VER still present after bump — these files need a manual look."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create 2-commit branch and open Pull Request
        id: create_pr
        if: steps.current.outputs.version != steps.latest.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ steps.latest.outputs.version }}"
          OLD_TAG="${{ steps.current.outputs.version }}"
          BRANCH="bot/croc-${NEW_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Switch to/create the PR branch from master
          git checkout -B "$BRANCH"

          # 1. Commit 1: Version string bumps across the app
          git add app/ third_party/CROC_VERSION
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump croc version strings ${OLD_TAG} → ${NEW_TAG}"
          fi

          # 2. Commit 2: Vendored croc source dump
          git add third_party/croc-src
          if ! git diff --staged --quiet; then
            git commit -m "chore: update vendored croc source to ${NEW_TAG}"
          fi

          # Push branch
          git push -u origin "$BRANCH" --force

          # Compose PR body using temporary file to safely handle newlines
          {
            echo "Auto-detected new croc release: https://github.com/schollz/croc/releases/tag/${{ steps.latest.outputs.version }}"
            echo "- Replaced \`third_party/croc-src\` with the tagged upstream source"
            echo "- Ran \`go mod tidy && go mod vendor\`"
            echo "- \`go build ./...\` passed"
            echo ""
            echo "**Files updated with the new version string:**"
            echo '```'
            echo "${{ steps.bump_version.outputs.changed_files }}"
            echo '```'
          } > /tmp/pr_body.txt

          if [ "${{ steps.stale_check.outputs.found }}" = "true" ]; then
            {
              echo ""
              echo "⚠️ **These files still contain the old version string and were NOT updated by this workflow — bump them manually:**"
              echo '```'
              echo "${{ steps.stale_check.outputs.files }}"
              echo '```'
            } >> /tmp/pr_body.txt
          fi

          if [ "${{ steps.fdroid_scan.outputs.found }}" = "true" ]; then
            {
              echo ""
              echo "⚠️ **F-Droid disallowed file types detected — review before merging:**"
              echo '```'
              echo "${{ steps.fdroid_scan.outputs.flagged }}"
              echo '```'
            } >> /tmp/pr_body.txt
          fi

          PR_TITLE="Bump croc ${OLD_TAG} → ${NEW_TAG}"

          # Create or update PR using GitHub CLI
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty' 2>/dev/null || true)
          if [ -z "$EXISTING_PR" ]; then
            PR_URL=$(gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.txt \
              --label "dependencies,automated" 2>/dev/null || \
              gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.txt)
          else
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr_body.txt
            PR_URL="$EXISTING_PR"
          fi

          rm -f /tmp/pr_body.txt
          echo "pull-request-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### 🐊 croc version check"
            echo ""
            if [ "${{ steps.latest.outcome }}" != "success" ]; then
              echo "❌ **Failed to fetch the latest release from GitHub.** Check the \"Get latest croc release\" step logs."
            elif [ "${{ steps.current.outputs.version }}" == "${{ steps.latest.outputs.version }}" ]; then
              echo "✅ Already up to date — croc \`${{ steps.current.outputs.version }}\`. Nothing to do."
            elif [ "${{ steps.replace.outcome }}" != "success" ]; then
              echo "❌ New version \`${{ steps.latest.outputs.version }}\` found, but cloning/replacing the source failed."
            elif [ "${{ steps.vendor.outcome }}" != "success" ]; then
              echo "❌ New version \`${{ steps.latest.outputs.version }}\` found, but \`go mod vendor\` / \`go build\` failed — upstream may have broken something. Needs a manual look."
            elif [ "${{ steps.create_pr.outcome }}" != "success" ]; then
              echo "❌ New version \`${{ steps.latest.outputs.version }}\` found and validated, but PR creation failed — check the \"Create 2-commit branch and open Pull Request\" step logs."
            elif [ "${{ steps.fdroid_scan.outputs.found }}" == "true" ] && [ "${{ steps.stale_check.outputs.found }}" == "true" ]; then
              echo "⚠️ **Updated** croc \`${{ steps.current.outputs.version }}\` → \`${{ steps.latest.outputs.version }}\` — but F-Droid-disallowed files were found AND stale version strings remain in files not covered by the sed script."
              echo ""
              echo "PR: ${{ steps.create_pr.outputs.pull-request-url }}"
            elif [ "${{ steps.fdroid_scan.outputs.found }}" == "true" ]; then
              echo "⚠️ **Updated** croc \`${{ steps.current.outputs.version }}\` → \`${{ steps.latest.outputs.version }}\` — but F-Droid-disallowed files were found in the vendored source."
              echo ""
              echo "PR: ${{ steps.create_pr.outputs.pull-request-url }}"
            elif [ "${{ steps.stale_check.outputs.found }}" == "true" ]; then
              echo "⚠️ **Updated** croc \`${{ steps.current.outputs.version }}\` → \`${{ steps.latest.outputs.version }}\` — but stale version strings remain in files this workflow doesn't know how to bump. See the PR body for the list."
              echo ""
              echo "PR: ${{ steps.create_pr.outputs.pull-request-url }}"
            else
              echo "🔄 **Updated** croc \`${{ steps.current.outputs.version }}\` → \`${{ steps.latest.outputs.version }}\`"
              echo ""
              echo "PR: ${{ steps.create_pr.outputs.pull-request-url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
